version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: linkforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=linkforge_db
    volumes:
      - mongo_data:/data/db
    networks:
      - linkforge-network

  redis:
    image: redis:7.2-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - linkforge-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  linkforge-network:
    driver: bridge
